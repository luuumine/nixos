name: nixos ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  get-targets:
    name: detect flake targets
    runs-on: native
    outputs:
      hosts: ${{ steps.set-hosts.outputs.hosts }}
      packages: ${{ steps.set-packages.outputs.packages }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: detect flake hosts
        id: set-hosts
        run: |
          HOSTS=$(nix eval .#nixosConfigurations --apply builtins.attrNames --json)
          echo "hosts=$HOSTS" >> "$FORGEJO_OUTPUT"
      - name: detect flake packages
        id: set-packages
        run: |
          PACKAGES=$(nix eval .#packages.x86_64-linux --apply builtins.attrNames --json)
          echo "packages=$PACKAGES" >> "$FORGEJO_OUTPUT"

  build-packages:
    name: build package
    runs-on: native
    needs: get-targets
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.get-targets.outputs.packages) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: build ${{ matrix.package }}
        run: nix build .#packages.x86_64-linux.${{ matrix.package }}

  build-hosts:
    name: build nixos
    runs-on: native
    needs:
      - get-targets
      - build-packages
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.get-targets.outputs.hosts) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: build ${{ matrix.host }}
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

  ci-succes:
    name: all checks passed
    runs-on: native
    needs:
      - build-hosts
      - build-packages
    steps:
      - name: verify success
        run: echo "everything successfully built!"
