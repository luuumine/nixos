name: nixos ci

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  flake-check:
    name: evaluate flake
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: install nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GH_TOKEN_NIX }}
      - name: setup cachix
        uses: cachix/cachix-action@v17
        with:
          name: luuumine-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: run nix flake check
        run: nix flake check

  get-hosts:
    name: detect flake hosts
    runs-on: ubuntu-latest
    needs: flake-check
    outputs:
      hosts: ${{ steps.set-hosts.outputs.hosts }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: install nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GH_TOKEN_NIX }}
      - name: setup cachix
        uses: cachix/cachix-action@v17
        with:
          name: luuumine-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: detect flake hosts
        id: set-hosts
        run: |
          HOSTS=$(nix eval .#nixosConfigurations --apply builtins.attrNames --json)
          echo "hosts=$HOSTS" >> "$GITHUB_OUTPUT"

  build-hosts:
    name: build nixos (${{ matrix.host }})
    runs-on: ubuntu-latest
    needs: get-hosts
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.get-hosts.outputs.hosts) }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: install nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GH_TOKEN_NIX }}
      - name: setup cachix
        uses: cachix/cachix-action@v17
        with:
          name: luuumine-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: build ${{ matrix.host }}
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
