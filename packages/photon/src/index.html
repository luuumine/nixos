<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app-container">
        <div class="left-panel">
            <div class="user-box">
                <div class="user-box-header">
                    Users (<span id="user-count">0</span>)
                </div>
                <div id="user-list"></div>
            </div>

            <div class="controls-box">
                <input type="text" id="username" placeholder="New username" />
                <button id="change-btn" onclick="changeUsername()">Change</button>
                <button id="connect-btn" onclick="toggleConnection()" class="btn-connect">Connect</button>
            </div>
        </div>

        <div class="chat-container">
            <div id="output" class="messages-area"></div>
            <div class="input-area">
                <input type="text" id="message" placeholder="Type a message..." />
                <button id="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    <script src="/app.js"></script>
</body>
</html>
