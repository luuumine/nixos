<nav class="nav">
  {% set path = current_path | default(value="") %}
  <div class="nav-inner">
    <a href="{{ get_url(path='/') }}" class="nav-link{% if path == '/' %} active{% endif %}">
      {% if path == "/" %}
      <span class="nav-indicator"></span>
      {% endif %}
      <span class="nav-label">home</span>
    </a>

    <a href="{{ get_url(path='blog/') }}" class="nav-link{% if path is starting_with(pat='/blog') %} active{%
      endif %}">
      {% if path is starting_with(pat="/blog") %}
      <span class="nav-indicator"></span>
      {% endif %}
      <span class="nav-label">blog</span>
    </a>

    <a href="{{ get_url(path='about/') }}" class="nav-link{% if path is starting_with(pat='/about') %} active{%
      endif %}">
      {% if path is starting_with(pat="/about") %}
      <span class="nav-indicator"></span>
      {% endif %}
      <span class="nav-label">about</span>
    </a>

    <a href="{{ get_url(path='links/') }}" class="nav-link{% if path is starting_with(pat='/links') %} active{%
      endif %}">
      {% if path is starting_with(pat="/links") %}
      <span class="nav-indicator"></span>
      {% endif %}
      <span class="nav-label">links</span>
    </a>
  </div>
</nav>
