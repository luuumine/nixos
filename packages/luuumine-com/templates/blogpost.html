{% extends "base.html" %}

{% block title %}{{ page.title }} - lumine{% endblock title %}

{% block content %}
<div class="blogpost">
  <nav>
    <a href="{{ get_url(path='@/blog/_index.md') }}">
      ← back to blog
    </a>
  </nav>

  <header class="blogpost-header">
    <time>{{ page.date | date(format="%B %d, %Y") }}</time>
    <h1>{{ page.title }}</h1>
  </header>

  <main class="blogpost-content">
    {{ page.content | safe }}
  </main>
</div>

{% endblock content %}
