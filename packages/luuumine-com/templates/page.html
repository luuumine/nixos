{% extends "base.html" %}

{% block title %}{{ page.title }} - lumine{% endblock title %}

{% block content %}
<header class="page-header">
  <h1 class="page-title">{{ page.title }}</h1>
  {% if page.extra.subtitle %}
  <p class="page-subtitle">{{ page.extra.subtitle }}</p>
  {% endif %}
</header>

<div class="page-content">
  {{ page.content | safe }}
</div>

{% endblock content %}
